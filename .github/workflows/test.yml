name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Install shellcheck
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        timeout-minutes: 1
        run: |
          shellcheck install.sh .cursor/install.sh .cursor/start.sh .agents/skills/chromium-browser-automation/scripts/setup.sh

  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Installer smoke test
        timeout-minutes: 1
        run: timeout 30 bash .github/install-smoke.sh

  skill-frontmatter:
    name: skill-frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Validate SKILL.md frontmatter
        timeout-minutes: 1
        run: python3 .github/skill-frontmatter-check.py
